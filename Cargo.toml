[package]
name = "dfe-transform-vector"
version = "1.0.12"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Rust wrapper for Vector.dev subprocess — Kafka-to-Kafka transform pipelines"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-transform-vector"
rust-version = "1.94"
exclude = [".claude/", ".github/", "ai/", "ci/", "chart/", "docs/"]

[lib]
name = "dfe_transform_vector"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-vector"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = ">=1.50", features = ["full"] }
tokio-util = { version = ">=0.7", features = ["rt"] }

# Shared library (CLI framework, deployment artefact generation, logging)
hyperi-rustlib = { version = ">=2.7.1", features = [
    "cli-service",
    "config-reload",
    "deployment",
    "http-server",
    "logger",
    "metrics",
    "metrics-dfe",
    "version-check",
] }

# Configuration
figment = { version = ">=0.10", features = ["env"] }
clap = { version = ">=4.5", features = ["derive", "env"] }
dotenvy = ">=0.15"

# Serialisation
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"
serde_yaml_ng = ">=0.10"

# Error handling
thiserror = ">=2.0"
anyhow = ">=1.0"

# Logging and tracing
tracing = ">=0.1"
tracing-subscriber = { version = ">=0.3", features = ["env-filter", "json"] }

# Metrics
metrics = ">=0.24"

# Note: Vector metrics proxy uses raw TcpStream (no HTTP client crate needed).
# Health + metrics HTTP servers use rustlib http-server (axum).

# Unix signals (sending SIGTERM/SIGHUP to child process)
nix = { version = ">=0.29", features = ["signal", "process"] }

# Allocator (Tier 1 release-track optimisation; CI opts in per channel)
tikv-jemallocator = { version = ">=0.6", optional = true }

[features]
# CI (hyperi-ci) opts in via --features jemalloc per release channel.
# Local cargo build uses the system allocator.
default = []
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
tempfile = ">=3.10"
tokio-test = ">=0.4"
testcontainers = ">=0.25"
testcontainers-modules = { version = ">=0.15", features = ["kafka"] }
hyperi-rustlib = { version = ">=2.5.4", features = [
    "transport-kafka",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Pedantic/nursery are advisory — not promoted to errors via -D warnings.
# Run `cargo clippy` without -D to see suggestions.
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

