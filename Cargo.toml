[package]
name = "dfe-transform-vector"
version = "1.0.13"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Kafka-to-Kafka transform pipelines, running Vector.dev as a managed subprocess. Runs standalone or as part of the HyperI Data Fusion Engine."
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-transform-vector"
rust-version = "1.95"
exclude = [".github/", "docs/"]

[lib]
name = "dfe_transform_vector"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-vector"
path = "src/main.rs"

# PGO workload driver -- built only with `--features pgo-driver`, by
# scripts/pgo-workload.sh during a release-channel Tier 2 build. hyperi-ci
# skips feature-gated bins when it detects and packages binaries, so this one
# never reaches the publish payload.
[[bin]]
name = "pgo-driver"
path = "src/bin/pgo_driver.rs"
required-features = ["pgo-driver"]

[dependencies]
# Async runtime
tokio = { version = ">=1.54.1, <2", features = ["full"] }
tokio-util = { version = ">=0.7.20, <0.8", features = ["rt"] }

# Shared library (CLI framework, deployment artefact generation, logging)
#
# `expression` compiles the CEL tiers of scalo's transport filters: without it
# a tier 2 or tier 3 filter in config is refused at load.
#
# `health` is REQUIRED for a truthful `/readyz`: the metrics listener only
# consults `HealthRegistry` under that feature, and its other readiness hook
# is snapshotted before the app can set one.
#
# `transport-grpc-vector-compat` carries the direct transport: the supervisor
# speaks scalo's `Transport/Push` to the rest of DFE and Vector's own
# `vector.Vector/PushEvents` to the subprocess, and scalo has both halves of the
# Vector protocol (`VectorCompatClient`, `VectorCompatService`). `lifecycle`
# carries the idle gate a transform with no source topics reports through.
# `worker-batch` carries the `BatchEngine` pipeline the bridge runs each leg on,
# which holds a push until its records are delivered.
#
# `transport-kafka` carries `KafkaConfig`, the security floor `Config::validate`
# holds the generated Kafka source and sink to, and `MESSAGE_MAX_BYTES`, the
# record ceiling the generated sink takes. Only its config is used: the image
# ships no librdkafka, so nothing here may build an rdkafka client.
#
# `scaling` carries the `ScalingPressure` the runtime serves at
# `/scaling/pressure` and writes into the `scaling_pressure` gauge; the
# supervisor drives its circuit gate directly, so it is named here as well as
# arriving through `cli-service`.
#
# The floor moves with `release.helm.library` in .hyperi-ci.yaml: the library
# renders only the contract version its scalo release writes.
scalo = { version = ">=2.14.24, <3", features = [
    "cli-service",
    "config-reload",
    "config-schema",
    "deployment",
    # A record the next stage would refuse for good goes to the file DLQ.
    "dlq",
    "expression",
    "health",
    "lifecycle",
    "logger",
    "metrics",
    "scaling",
    "service-metrics",
    "transport-grpc",
    "transport-grpc-vector-compat",
    "transport-kafka-config",
    "version-check",
    "worker-batch",
] }

# Configuration
figment = { version = ">=0.10.19, <0.11", features = ["env"] }
clap = { version = ">=4.6.7, <5", features = ["derive", "env"] }

# Record payloads across the direct-transport bridge, which moves bytes rather
# than copying them between the two gRPC legs.
bytes = ">=1.12.1, <2"

# Serialisation
serde = { version = ">=1.0.229, <2", features = ["derive"] }
serde_json = ">=1.0.154, <2"

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# Error handling
thiserror = ">=2.0.21, <3"
anyhow = ">=1.0.104, <2"

# Logging and tracing
tracing = ">=0.1.44, <0.2"
tracing-subscriber = { version = ">=0.3.23, <0.4", features = ["env-filter", "json"] }

# Metrics
metrics = ">=0.24.6, <0.25"

# Note: Vector metrics proxy uses raw TcpStream (no HTTP client crate needed).
# /metrics, /livez and /readyz are served by scalo's MetricsManager listener.

# Unix signals (sending SIGTERM/SIGHUP to child process), and renameat2 to
# swap a reload's staged config in whole
nix = { version = ">=0.31.3, <0.32", features = ["signal", "process", "fs"] }

# Allocator (Tier 1 release-track optimisation; CI opts in per channel)
tikv-jemallocator = { version = ">=0.7.0, <0.8", optional = true }
prometheus-parse = ">=0.2.5, <0.3"

[features]
# CI (hyperi-ci) opts in via --features jemalloc per release channel.
# Local cargo build uses the system allocator.
default = []
jemalloc = ["dep:tikv-jemallocator"]
# The PGO workload driver bin. Needs no dependency the supervisor does not
# already carry, so a production build is unaffected either way.
pgo-driver = []

[dev-dependencies]
tempfile = ">=3.27.0, <4"
tokio-test = ">=0.4.6, <0.5"
# The WS21 filebeat corpus (tests/common/filebeat.rs) is read in memory from
# dfe-transform-vrl's committed tar.gz; chrono compares transformed timestamps
# against the elastic golden outputs.
flate2 = ">=1.1.10, <2"
tar = ">=0.4.46, <0.5"
chrono = ">=0.4.45, <0.5"
testcontainers = ">=0.27.3, <0.28"
testcontainers-modules = { version = ">=0.15, <0.16", features = ["kafka"] }
scalo = { version = ">=2.14.24, <3", features = [
    "transport-kafka",
] }
# The repo's own .env for the live-broker tests. The binary's .env is read by scalo's cascade.
dotenvy = ">=0.15.7, <0.16"
# A stand-in Vector source for the bridge tests; scalo already builds this tonic.
tonic = { version = ">=0.14.6, <0.15", features = ["gzip"] }
# Reads back what the app counted; the Prometheus exporter already builds it.
metrics-util = { version = ">=0.20.4, <0.21", default-features = false, features = [
    "debugging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Groups get priority = -1 so an individual lint level always wins
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
# Types keep descriptive names even where the module path repeats them, so call sites read without it.
module_name_repetitions = "allow"
# #[must_use] goes where dropping the value is a bug, not on every pure function.
must_use_candidate = "allow"
# The lints below fire in tests/ (54 sites) and one in main.rs, and the rest of src is clean.
# 6 doc comments, 5 map then unwrap_or chains, 2 let-else candidates.
doc_markdown = "allow"
map_unwrap_or = "allow"
manual_let_else = "allow"
# 10 raw strings, 8 closures, 8 bare #[ignore] attributes.
needless_raw_string_hashes = "allow"
redundant_closure_for_method_calls = "allow"
ignore_without_reason = "allow"
# 2 float compares, 2 file extension compares, 2 similar names, 2 Duration subtractions, 2 empty asserts.
float_cmp = "allow"
case_sensitive_file_extension_comparisons = "allow"
similar_names = "allow"
unchecked_time_subtraction = "allow"
assert_is_empty = "allow"
# 1 single-arm match, 1 filter_map then next, 1 push_str of a format!, and 2 functions over 150 lines (the startup sequence in main.rs, one e2e test).
single_match_else = "allow"
filter_map_next = "allow"
format_push_string = "allow"
too_many_lines = "allow"

