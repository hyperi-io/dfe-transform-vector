[package]
name = "dfe-transform-vector"
version = "1.0.0-dev.1"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Rust wrapper for Vector.dev subprocess — Kafka-to-Kafka transform pipelines"
license = "FSL-1.1-ALv2"
repository = "https://github.com/hyperi-io/dfe-transform-vector"
rust-version = "1.94"
exclude = [".claude/", ".github/", "ai/", "ci/", "chart/", "docs/"]

[lib]
name = "dfe_transform_vector"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-vector"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = ">=1.50", features = ["full"] }
tokio-util = { version = ">=0.7", features = ["rt"] }

# Shared library (CLI framework, deployment artefact generation, logging)
hyperi-rustlib = { version = ">=1.16", features = [
    "cli",
    "deployment",
    "logger",
] }

# Configuration
figment = { version = ">=0.10", features = ["env"] }
clap = { version = ">=4.5", features = ["derive", "env"] }
dotenvy = ">=0.15"

# Serialisation
serde = { version = ">=1.0", features = ["derive"] }
serde_json = ">=1.0"
serde_yaml_ng = ">=0.10"

# Error handling
thiserror = ">=2.0"
anyhow = ">=1.0"

# Logging and tracing
tracing = ">=0.1"
tracing-subscriber = { version = ">=0.3", features = ["env-filter", "json"] }

# Metrics and HTTP
prometheus = ">=0.14"
hyper = { version = ">=1.8", features = ["server", "http1"] }
hyper-util = { version = ">=0.1", features = ["tokio"] }
http-body-util = ">=0.1"

# Unix signals (sending SIGTERM/SIGHUP to child process)
nix = { version = ">=0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = ">=3.10"
tokio-test = ">=0.4"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
rdkafka = { version = "0.39", features = ["cmake-build"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
