[package]
name = "dfe-transform-vector"
version = "1.0.13"
edition = "2024"
authors = ["HyperI <dev@hyperi.com.au>"]
description = "Kafka-to-Kafka transform pipelines, running Vector.dev as a managed subprocess. Runs standalone or as part of the HyperI Data Fusion Engine."
license = "BUSL-1.1"
repository = "https://github.com/hyperi-io/dfe-transform-vector"
rust-version = "1.95"
exclude = [".github/", "chart/", "docs/"]

[lib]
name = "dfe_transform_vector"
path = "src/lib.rs"

[[bin]]
name = "dfe-transform-vector"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = ">=1.50, <2", features = ["full"] }
tokio-util = { version = ">=0.7, <0.8", features = ["rt"] }

# Shared library (CLI framework, deployment artefact generation, logging)
#
# `expression` is REQUIRED for the horizontal scaling engine: the
# ScalingEngine is `#[cfg(all(feature="scaling", feature="expression"))]`
# and `cli-service` pulls `scaling` but NOT `expression`. Without it the
# engine silently compiles out -- no scaling_pressure gauge, signals
# pushed to a cell nobody reads.
#
# `health` is REQUIRED for a truthful `/readyz`: the metrics listener only
# consults `HealthRegistry` under that feature, and its other readiness hook
# is snapshotted before the app can set one.
scalo = { version = ">=2.10.14, <3", features = [
    "cli-service",
    "config-reload",
    "config-schema",
    "deployment",
    "expression",
    "health",
    "logger",
    "metrics",
    "service-metrics",
    "version-check",
] }

# Configuration
figment = { version = ">=0.10, <0.11", features = ["env"] }
clap = { version = ">=4.5, <5", features = ["derive", "env"] }
dotenvy = ">=0.15, <0.16"

# Serialisation
serde = { version = ">=1.0, <2", features = ["derive"] }
serde_json = ">=1.0, <2"
serde_yaml_ng = ">=0.10, <0.11"

# JSON Schema derivation for the reflectable config-schema capability
# (scalo-rs#6). Same version range as scalo so cargo unifies to one schemars.
schemars = { version = ">=1.2.1, <2", default-features = false, features = ["std", "derive", "preserve_order"] }

# Error handling
thiserror = ">=2.0, <3"
anyhow = ">=1.0, <2"

# Logging and tracing
tracing = ">=0.1, <0.2"
tracing-subscriber = { version = ">=0.3, <0.4", features = ["env-filter", "json"] }

# Metrics
metrics = ">=0.24, <0.25"

# Note: Vector metrics proxy uses raw TcpStream (no HTTP client crate needed).
# /metrics, /livez and /readyz are served by scalo's MetricsManager listener.

# Unix signals (sending SIGTERM/SIGHUP to child process)
nix = { version = ">=0.31.3, <0.32", features = ["signal", "process"] }

# Allocator (Tier 1 release-track optimisation; CI opts in per channel)
tikv-jemallocator = { version = ">=0.7.0, <0.8", optional = true }
prometheus-parse = ">=0.2.5, <0.3"

[features]
# CI (hyperi-ci) opts in via --features jemalloc per release channel.
# Local cargo build uses the system allocator.
default = []
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
tempfile = ">=3.10, <4"
tokio-test = ">=0.4, <0.5"
bytes = ">=1.11, <2"
# The WS21 filebeat corpus (tests/common/filebeat.rs) is read in memory from
# dfe-transform-vrl's committed tar.gz; chrono compares transformed timestamps
# against the elastic golden outputs.
flate2 = ">=1.1, <2"
tar = ">=0.4.44, <0.5"
chrono = ">=0.4.45, <0.5"
testcontainers = ">=0.28.0, <0.29"
testcontainers-modules = { version = ">=0.15, <0.16", features = ["kafka"] }
scalo = { version = ">=2.10.14, <3", features = [
    "transport-kafka",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Pedantic/nursery are advisory — not promoted to errors via -D warnings.
# Run `cargo clippy` without -D to see suggestions.
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

