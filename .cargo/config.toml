# Per-target CPU optimisations.
#
# Under [target.<triple>], never [build]: cargo drops build.rustflags when a
# CARGO_TARGET_<triple>_RUSTFLAGS is set, as CI runners do.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-cpu=generic"]
