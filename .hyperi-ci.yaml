classification: product

language: rust

# Quality checks
quality:
  enabled: true
  # Advisory ignores fed to cargo-audit and osv-scanner.
  ignore:
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: unreachable, no Baggage propagator registered in dfe-transform-vector or scalo. Not reachable per dfe-infra docs/THREAT-MODEL.md accepted risks. Blocked on metrics-exporter-opentelemetry 0.2.1 requiring opentelemetry ^0.31; tracked in hyperi-io/scalo-rs#281."

# Testing
test:
  enabled: true
  coverage: false
  rust:
    # The metrics tests need a process each: the global recorder installs once per process.
    nextest: true
  # A release runs the full tier: the Vector validator cases and the opt-in
  # Kafka pipelines. tests/TESTING.md says which tests are which.
  full:
    required_for_release: true

# Building
build:
  enabled: true
  strategies:
    - native
  rust:
    glibc_max: "2.41"
    # Any C library a release links comes from hyperi-ci's static prefix, so
    # the image installs no C library packages.
    static_libs: true
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # PGO and BOLT reach the supervisor's own binary only, not the Vector binary the image downloads.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        # Built before the workload clock starts: an uncached arm64 runner takes longer than the workload timeout to compile it.
        workload_setup_cmd: "cargo build --release --features pgo-driver --bin pgo-driver"
        # 300s is the floor a stable profile needs: a short workload biases
        # the compiler toward startup paths and turns PGO NEGATIVE.
        duration_secs: 300
      bolt:
        enabled: true

# Release (where the artefacts go). The thin chart is assembled from the
# emitted contract and ships beside the image.
release:
  enabled: true
  # Keep `library` at the scalo version in Cargo.toml: the library renders only the contract version its scalo release writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.29"
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # `src/deployment.rs::emit_dockerfile()` splices the Vector install into the Dockerfile.
