# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true

# Testing
test:
  enabled: true
  coverage: false

# Building
build:
  enabled: true
  type: app
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Publishing (on release)
publish:
  enabled: true
  target: internal
  binaries: both
  container:
    enabled: true
    registry: jfrog
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
    registry: jfrog
