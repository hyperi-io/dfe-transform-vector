# Project language (auto-detected if not specified)
language: rust

# Quality checks
quality:
  enabled: true
  # Advisory ignores fed to cargo-audit and osv-scanner.
  ignore:
    # GHSA-w9wp-h8wv-79jx / CVE-2026-48504: opentelemetry_sdk 0.31.0 reaches the
    # lock only through scalo. The flaw is in BaggagePropagator's header parsing,
    # and neither this repo nor scalo registers a Baggage or other text map
    # propagator, so it is never called. Recorded as not reachable in the DFE
    # threat model (dfe-infra docs/THREAT-MODEL.md, accepted risks). scalo holds
    # 0.31 because metrics-exporter-opentelemetry 0.2.1 requires opentelemetry
    # ^0.31; tracked in hyperi-io/scalo-rs#281.
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.0 via scalo: unreachable, no Baggage propagator registered in dfe-transform-vector or scalo. Not reachable per dfe-infra docs/THREAT-MODEL.md accepted risks. Blocked on metrics-exporter-opentelemetry 0.2.1 requiring opentelemetry ^0.31; tracked in hyperi-io/scalo-rs#281."

# Testing
test:
  enabled: true
  coverage: false
  rust:
    # The metrics tests need process-per-test isolation: a global recorder
    # installs once per process, so under cargo test only the first test to
    # run gets a live registry. Fail rather than silently degrade to it.
    nextest: true

# Building
build:
  enabled: true
  strategies:
    - native
  rust:
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    # Tier 2 release-track optimisation. hyperi-ci applies jemalloc + fat LTO
    # on the release channel by itself; this section opts in to PGO + BOLT on
    # top, and both are gated on that channel (optimize.py:125,129).
    #
    # What it covers: the supervisor's own binary -- the direct-transport
    # bridge, the subprocess watch and the Vector metrics merge. Vector's
    # per-record CPU on the bus transport is inside the upstream binary the
    # image downloads rather than compiles (scripts/fetch-vector.sh), so no
    # PGO or BOLT we run here reaches it.
    optimize:
      pgo:
        enabled: true
        workload_cmd: "bash scripts/pgo-workload.sh"
        # 300s is the floor a stable profile needs: a short workload biases
        # the compiler toward startup paths and turns PGO NEGATIVE.
        duration_secs: 300
      bolt:
        enabled: true  # Linux only; skipped on non-Linux targets

# Release (where the artefacts go). The thin chart is assembled from the
# emitted contract and ships beside the image.
release:
  enabled: true
  # Keep `library` at the scalo version in Cargo.toml: the library renders only the contract version its scalo release writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.3"
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # Vector binary install + data dirs are spliced into the Dockerfile
    # by `src/deployment.rs::emit_dockerfile()` (consumer-side post-process
    # over scalo's base output). When hyperi-ci's overlay framework
    # lands, this moves to `release.container.overlays:` here.
