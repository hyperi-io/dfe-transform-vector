# Project:   dfe-transform-vector
# File:      pipelines/filebeat/filebeat.yaml
# Purpose:   Bundled filebeat pipeline - the DFE 2.1 filebeat VRL as a Vector remap
# Language:  YAML
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# A pre-canned transform file, dropped into `transforms.dir` as it stands: the
# wrapper writes it into Vector's config dir verbatim, so the top-level
# `enrichment_tables` key reaches Vector and the VRL's timezone lookups resolve.
# `inputs: [dfe_source]` binds it to whatever Kafka topic `dfe_source` derives,
# and the wrapper wires the transform's output to `dfe_sink`.
#
# The `path` below is where the dfe-docker compose stack mounts the table. The
# image does not ship timezones.csv, so any other deployment mounts it at that
# path or points `path` at its own copy; startup validation names the path when
# the file is not there.
#
# The VRL body is byte-identical to dfe-transform-vrl pipelines/filebeat/
# filebeat.vrl @ e0b7087, which is where it is maintained. Refresh by copying
# that file again rather than editing the copy here, so the two transform apps
# keep grading against the same corpus.

enrichment_tables:
  timezones:
    type: file
    file:
      path: /etc/dfe-transform-vector/data/timezones.csv
      encoding:
        type: csv
    schema:
      abbreviation: string

transforms:
  filebeat:
    type: remap
    inputs:
      - dfe_source
    source: |
      ##############################################################################
      # dfe-transform-vrl bundled pipeline: filebeat-compat -- INTERIM
      #
      # Single-file port of the DFE 2.1 Vector filebeat transform templates
      # (dfe-vector-templates src/core_templates 14x family):
      #   140-transform-filebeat-cisco-meraki-logs
      #   141-transform-filebeat-cisco-ios-logs
      #   143..149-transform-filebeat-cisco-umbrella-*-logs (7 files, one body)
      #
      # The DFE 2.1 Vector deployment split this across per-module files to work
      # around Vector's large-VRL-file limits, and its route transform fanned
      # every {message,tags,timestamp} event to EVERY module transform, relying
      # on drop_on_abort to discard the wrong parses. Embedded VRL has no
      # file-size problem and runs one program per event, so this port detects
      # the module first and runs only that module's transform. The seven
      # umbrella templates differed only in the hardcoded .log.file.path seed;
      # they collapse to one body driven by the detected log type.
      #
      # INTERIM: this pipeline keeps DFE 2.1 filebeat feeds working on
      # dfe-transform-vrl. Elastic compatibility is being replaced by
      # dfe-transform-elastic (Rust-native, currently in beta); new integrations
      # should NOT build on this file.
      #
      # Deliberate departures from the 2.1 templates:
      #   - geoip enrichment is NOT ported: dfe-loader owns geoip enrichment in
      #     the current DFE pipeline layout.
      #   - unmatched events are tagged "filebeat_unmatched" and passed through
      #     instead of being silently dropped by the route fan-out.
      #
      # Requirements (matching the 2.1 deployment contract):
      #   - enrichment table "timezones" (bundled timezones.csv, key column
      #     "abbreviation") for cisco-ios and meraki timestamp resolution.
      #   - events MAY carry ._conf.tz_offset (abbreviation like "UTC" or offset
      #     like "-0600"); without it the ios/meraki @timestamp mapping is
      #     skipped, exactly as in DFE 2.1.
      ##############################################################################

      _ingest = {}
      _ingest.timestamp = now()

      # --- module detection ------------------------------------------------------
      _module = "unknown"
      _umbrella_type = ""
      _msg = string(.message) ?? string(.event.original) ?? ""

      if match(_msg, r'^<134>1 \d{9,10}\.\d+ ') {
          # Meraki syslog: <134>1 <epoch.frac> <host> <event_type> ...
          # (DFE 2.1 routed on the <134> prefix alone; the epoch check keeps a
          # local0.info Cisco IOS device out of the meraki branch.)
          _module = "cisco_meraki_logs"
      } else if match(_msg, r'^<\d{1,3}>') {
          # Any other syslog-priority-prefixed line is Cisco IOS (the only
          # syslog module in the 14x family besides Meraki).
          _module = "cisco_ios_logs"
      } else if match(_msg, r'%[A-Z][A-Z0-9_-]*-\d-[A-Z0-9_]+') && !match(_msg, r'^"?(\d{4}-\d{2}-\d{2} |\d+",")') {
          # Cisco IOS %FACILITY-SEVERITY-MNEMONIC marker without a syslog
          # header. The facility itself may carry dashes
          # (e.g. %SNMP-SW1-3-RESPONSE_DELAYED). Umbrella CSV rows open with an
          # ISO date (audit: a numeric id column), so a marker-lookalike inside
          # a CSV field (a proxy URL, a dlp filename) must not steal the line
          # from the CSV branch.
          _module = "cisco_ios_logs"
      } else {
          # Cisco Umbrella exports are CSV; DFE 2.1 carried the log type in the
          # S3 object path. Honour an upstream-provided .log.file.path first,
          # then fall back to column-shape detection (counts verified against
          # the elastic/integrations pipeline test corpus).
          _path = string(.log.file.path) ?? ""
          if contains(_path, "auditlogs") {
              _umbrella_type = "auditlogs"
          } else if contains(_path, "firewalllogs") {
              _umbrella_type = "cloudfirewalllogs"
          } else if contains(_path, "dlplogs") {
              _umbrella_type = "dlplogs"
          } else if contains(_path, "dnslogs") {
              _umbrella_type = "dnslogs"
          } else if contains(_path, "intrusionlogs") {
              _umbrella_type = "intrusionlogs"
          } else if contains(_path, "iplogs") {
              _umbrella_type = "iplogs"
          } else if contains(_path, "proxylogs") {
              _umbrella_type = "proxylogs"
          }

          if _umbrella_type == "" && _msg != "" {
              # Same `", "` normalisation the umbrella body applies before
              # parse_csv (the export quotes fields inconsistently).
              _csv, _csv_err = parse_csv(replace(_msg, r'", "', s'","'))
              if _csv_err == null {
                  _n = length(_csv)
                  _c0 = string(_csv[0]) ?? ""
                  _c1 = string(_csv[1]) ?? ""
                  _ts_re = r'^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
                  if _n == 7 && match(_c0, _ts_re) {
                      _umbrella_type = "iplogs"
                  } else if _n == 9 && match(_c1, _ts_re) {
                      # v5 audit format: numeric event id, then the timestamp.
                      _umbrella_type = "auditlogs"
                  } else if _n == 13 && match(_c0, _ts_re) {
                      _umbrella_type = "dnslogs"
                  } else if _n >= 10 && _n <= 12 && match(_c0, _ts_re) && match(string(_csv[6]) ?? "", r'^\d+ \(') {
                      # Older dns export without the trailing policy columns;
                      # column 6 is the "<n> (TYPE)" dns query type.
                      _umbrella_type = "dnslogs"
                  } else if (_n == 14 || _n == 16) && match(_c0, _ts_re) {
                      # cloud firewall: 14 columns, or 16 with fqdns +
                      # destination list ids appended.
                      _umbrella_type = "cloudfirewalllogs"
                  } else if _n == 17 && match(_c0, _ts_re) {
                      # dlp and intrusion both carry 17 columns; intrusion has
                      # numeric gid/sid at columns 3 and 4.
                      if match(string(_csv[3]) ?? "", r'^\d+$') && match(string(_csv[4]) ?? "", r'^\d+$') {
                          _umbrella_type = "intrusionlogs"
                      } else {
                          _umbrella_type = "dlplogs"
                      }
                  } else if _n >= 20 && match(_c0, _ts_re) {
                      _umbrella_type = "proxylogs"
                  }
              }
          }
          if _umbrella_type != "" {
              _module = "cisco_umbrella"
          }
      }

      if _module == "cisco_meraki_logs" {
          _ingest.pipeline = "cisco_meraki_logs"
          _ingest.on_failure_pipeline = "cisco_meraki_logs"
          .tags = ["preserve_original_event", "forwarded"]
          .ecs.version = "8.11.0"
          if .event.original == null {
              if .message != null {
                  if .event.original == null {
                      .event.original = del(.message)
                  } else {
                      assert!(false, ".event.original must be null or override: true")
                  }
              }
          }
          if .event.original != null {
              tmp, err = parse_groks(value: .event.original, patterns: [s'^%{DATA} %{DATA:_temp.ts_nano} %{DATA:observer.hostname} %{DATA:cisco_meraki.event_type} %{DATA}$'])
              if err == null {
                  . = merge(., tmp, deep: true)
              } else {
                  assert!(false, "failed to dissect .event.original: " + to_string(err))
              }
          } else {
              err = ".event.original must not be nullish"
              assert!(false, err)
          }
          if ._conf.tz_offset != null && ._conf.tz_offset != "local" {
              date = null
              err = "no datetime formats provided"
              if err != null {
                  datetime = to_string!(._temp.ts_nano)
                  external_timezone = ._conf.tz_offset
                  if false {
                      external_timezone = null
                  }
                  records = if match!(external_timezone, r'[\+-]?[0-9]{1,2}:?[0-9]{2}') {
                      [{ "offset": external_timezone }]
                  } else {
                      find_enrichment_table_records!(table: "timezones", condition: { "abbreviation": external_timezone })
                  }
                  if length(records) == 1 {
                      offset = records[0].offset
                      date, err = parse_timestamp(value: join!(value: [datetime, offset], separator: " "), format: join!(value: ["%s%.f", "%:z"], separator: " "))
                  } else {
                      if length(records) > 1 {
                          err = "ambiguous timezone abbreviation"
                      } else {
                          if length(records) == 0 {
                              err = "no timezone abbreviation found"
                          }
                      }
                  }
              }
              if err == null {
                  .@timestamp = date
              } else {
                  _ingest.on_failure_processor_type = "date"
                  _ingest.on_failure_processor_tag = "<no value>"
                  _ingest.on_failure_message = to_string(err)
                  if !is_array(.error.message) {
                      if .error.message == null {
                          .error.message = []
                      } else {
                          .error.message = [.error.message]
                      }
                  }
                  .error.message = append!({
                      expr = .error.message
                      if false {
                          expr = null
                      }
                      expr
                  }, [join!(["failed to parse time field (", to_string!(._temp.ts_nano), "): ", _ingest.on_failure_message], "")])
              }
          }
          if ._conf.tz_offset == null || ._conf.tz_offset == "local" {
              date = null
              err = "no datetime formats provided"
              if err != null {
                  datetime = to_string!(._temp.ts_nano)
                  date, err = parse_timestamp(value: join!(value: [datetime], separator: " "), format: join!(value: ["%s%.f"], separator: " "))
              }
              if err == null {
                  .@timestamp = date
              } else {
                  _ingest.on_failure_processor_type = "date"
                  _ingest.on_failure_processor_tag = "<no value>"
                  _ingest.on_failure_message = to_string(err)
                  if !is_array(.error.message) {
                      if .error.message == null {
                          .error.message = []
                      } else {
                          .error.message = [.error.message]
                      }
                  }
                  .error.message = append!({
                      expr = .error.message
                      if false {
                          expr = null
                      }
                      expr
                  }, [join!(["failed to parse time field (", to_string!(._temp.ts_nano), "): ", _ingest.on_failure_message], "")])
              }
          }
          if {
              expr = ["flows", "firewall", "vpn_firewall", "cellular_firewall", "bridge_anyconnect_client_vpn_firewall"]
              value = .cisco_meraki.event_type
              if false {
                  expr = null
                  value = null
              }
              if is_array(expr) {
                  includes(array!(expr), value)
              } else {
                  if is_string(expr) {
                      contains(string!(expr), string!(value))
                  } else {
                      assert!(false, "contains only works on strings and array")
                  }
              }
          } {
              _ingest.timestamp = now()
              if _ingest.pipeline == null {
                  _ingest.pipeline = "<no value>"
                  _ingest.on_failure_pipeline = "<no value>"
              }
              if !is_nullish(.event.original) {
                  value, err = parse_groks(value: .event.original, patterns: [s'.*?%{TYPE}( %{NOTSPACE:cisco_meraki.flows.op})? src=%{IP:source.ip} dst=%{IP:destination.ip}( mac=%{MAC:source.mac})? protocol=%{NOTSPACE:network.protocol}( type=%{NOTSPACE})?( sport=%{NONNEGINT:source.port})?( dport=%{NONNEGINT:destination.port})?( pattern: %{GREEDYDATA:cisco_meraki.firewall.pattern})?.*'], aliases: { "TYPE": s'(flows|firewall|vpn_firewall|cellular_firewall|bridge_anyconnect_client_vpn_firewall)' })
                  if err == null {
                      if value.destination.ip != null {
                          value.destination.ip = to_string!(value.destination.ip)
                      }
                      if value.destination.port != null {
                          value.destination.port = parse_int!(value.destination.port)
                      }
                      if value.source.ip != null {
                          value.source.ip = to_string!(value.source.ip)
                      }
                      if value.source.port != null {
                          value.source.port = parse_int!(value.source.port)
                      }
                      . = merge(., value, deep: true)
                  } else {
                      assert!(false, "failed to grok .event.original:" + to_string(err))
                  }
              } else {
                  assert!(false, ".event.original must not be nullish")
              }
              if .cisco_meraki.firewall.pattern != null && (starts_with!({
              expr = .cisco_meraki.firewall.pattern
              if false {
                  expr = null
              }
              expr
          }, "allow") || starts_with!({
              expr = .cisco_meraki.firewall.pattern
              if false {
                  expr = null
              }
              expr
          }, "deny")) {
                  if !is_nullish(.cisco_meraki.firewall.pattern) {
                      value, err = parse_groks(value: .cisco_meraki.firewall.pattern, patterns: [s'.*?%{NOTSPACE:cisco_meraki.firewall.action} %{GREEDYDATA:cisco_meraki.firewall.rule}.*'])
                      if err == null {
                          . = merge(., value, deep: true)
                      }
                  }
              }
              if .cisco_meraki.firewall.rule != null {
                  if !exists(.cisco_meraki.firewall.pattern) {
                      assert!(false, "tried to remove field '.cisco_meraki.firewall.pattern' that doesn't exist")
                  }
                  del(.cisco_meraki.firewall.pattern)
              }
              if !is_nullish(.source.mac) {
                  if is_array(.source.mac) {
                      .source.mac = map_values(array!(.source.mac)) -> |value| {
                          replace!(value, r'[:.]', "-")
                      }
                  } else {
                      if false {
                          .source.mac = null
                      }
                      target, err = replace(.source.mac, r'[:.]', "-")
                      if err == null {
                          .source.mac = target
                      } else {
                          assert!(false, to_string(err))
                      }
                  }
              }
              if .cisco_meraki.flows.op == null {
                  .cisco_meraki.event_subtype = "ip_session_initiated"
              }
              if .cisco_meraki.flows.op == "allow" {
                  .cisco_meraki.event_subtype = "flow_allowed"
              }
              if .cisco_meraki.flows.op == "deny" {
                  .cisco_meraki.event_subtype = "flow_denied"
              }
          }
          if .cisco_meraki.event_type == "ip_flow_start" || .cisco_meraki.event_type == "ip_flow_end" {
              _ingest.timestamp = now()
              if _ingest.pipeline == null {
                  _ingest.pipeline = "<no value>"
                  _ingest.on_failure_pipeline = "<no value>"
              }
              if .event.original != null {
                  tmp, err = parse_groks(value: .event.original, patterns: [s'^%{DATA} %{DATA} %{DATA} %{DATA:_temp.event_type} %{DATA:_temp.event}$'])
                  if err == null {
                      . = merge(., tmp, deep: true)
                  } else {
                      assert!(false, "failed to dissect .event.original: " + to_string(err))
                  }
              } else {
                  err = ".event.original must not be nullish"
                  assert!(false, err)
              }
              if ._temp.event != null {
                  if !is_nullish(._temp.event) {
                      kv, err = parse_key_value(._temp.event, key_value_delimiter: "=", field_delimiter: " ", accept_standalone_key: true, whitespace: "strict")
                      if err == null {
                          standalone_key = false
                          for_each(kv) -> |_, value| {
                              if value == true {
                                  standalone_key = true
                              }
                          }
                          if standalone_key {
                              err = "field ._temp.event does not contain value_split [=]"
                          }
                      }
                      if err == null {
                          if . == null {
                              . = {  }
                          }
                          . = merge(object(.), kv, deep: true)
                      } else {
                          assert!(false, to_string(err))
                      }
                  } else {
                      err = "._temp.event must not be nullish"
                      assert!(false, to_string(err))
                  }
              }
              if .translated_src_ip != null {
                  if !is_nullish(.translated_src_ip) {
                      if is_ipv4(string!(.translated_src_ip)) || is_ipv6(string!(.translated_src_ip)) {
                          .source.ip = .translated_src_ip
                      } else {
                          err = "Failed converting .translated_src_ip to an IP address"
                          assert!(false, err)
                      }
                  } else {
                      err = ".translated_src_ip must be present"
                      assert!(false, err)
                  }
              }
              if .translated_src_ip == null && .src != null {
                  if !is_nullish(.src) {
                      if is_ipv4(string!(.src)) || is_ipv6(string!(.src)) {
                          .source.ip = .src
                      } else {
                          err = "Failed converting .src to an IP address"
                          assert!(false, err)
                      }
                  } else {
                      err = ".src must be present"
                      assert!(false, err)
                  }
              }
              if .translated_src_ip != null && .translated_port != null {
                  if !is_nullish(.translated_port) {
                      if is_string(.translated_port) {
                          temp = .translated_port
                          if temp != "0" {
                              temp = replace!(temp, r'^0*(?P<suffix>[0-9]+)', "$suffix")
                          }
                          temp, err = parse_int(temp)
                          if err == null {
                              .source.port = temp
                          } else {
                              err_msg = join!(["Failed converting .translated_port to an integer. Found (", to_string!(.translated_port), "), ", to_string(err)], "")
                              assert!(false, err_msg)
                          }
                      } else {
                          if is_integer(.translated_port) {
                              .source.port = .translated_port
                          } else {
                              err = "Failed converting .translated_port to an integer"
                              assert!(false, err)
                          }
                      }
                  } else {
                      err = ".translated_port must be present"
                      assert!(false, err)
                  }
              }
              if .translated_src_ip == null && .sport != null {
                  if !is_nullish(.sport) {
                      if is_string(.sport) {
                          temp = .sport
                          if temp != "0" {
                              temp = replace!(temp, r'^0*(?P<suffix>[0-9]+)', "$suffix")
                          }
                          temp, err = parse_int(temp)
                          if err == null {
                              .source.port = temp
                          } else {
                              err_msg = join!(["Failed converting .sport to an integer. Found (", to_string!(.sport), "), ", to_string(err)], "")
                              assert!(false, err_msg)
                          }
                      } else {
                          if is_integer(.sport) {
                              .source.port = .sport
                          } else {
                              err = "Failed converting .sport to an integer"
                              assert!(false, err)
                          }
                      }
                  } else {
                      err = ".sport must be present"
                      assert!(false, err)
                  }
              }
              if .translated_dst_ip != null {
                  if !is_nullish(.translated_dst_ip) {
                      if is_ipv4(string!(.translated_dst_ip)) || is_ipv6(string!(.translated_dst_ip)) {
                          .destination.ip = .translated_dst_ip
                      } else {
                          err = "Failed converting .translated_dst_ip to an IP address"
                          assert!(false, err)
                      }
                  } else {
                      err = ".translated_dst_ip must be present"
                      assert!(false, err)
                  }
              }
              if .translated_dst_ip == null && .dst != null {
                  if !is_nullish(.dst) {
                      if is_ipv4(string!(.dst)) || is_ipv6(string!(.dst)) {
                          .destination.ip = .dst
                      } else {
                          err = "Failed converting .dst to an IP address"
                          assert!(false, err)
                      }
                  } else {
                      err = ".dst must be present"
                      assert!(false, err)
                  }
              }
              if .translated_dst_ip != null && .translated_port != null {
                  if !is_nullish(.translated_port) {
                      if is_string(.translated_port) {
                          temp = .translated_port
                          if temp != "0" {
                              temp = replace!(temp, r'^0*(?P<suffix>[0-9]+)', "$suffix")
                          }
                          temp, err = parse_int(temp)
                          if err == null {
                              .destination.port = temp
                          } else {
                              err_msg = join!(["Failed converting .translated_port to an integer. Found (", to_string!(.translated_port), "), ", to_string(err)], "")
                              assert!(false, err_msg)
                          }
                      } else {
                          if is_integer(.translated_port) {
                              .destination.port = .translated_port
                          } else {
                              err = "Failed converting .translated_port to an integer"
                              assert!(false, err)
                          }
                      }
                  } else {
                      err = ".translated_port must be present"
                      assert!(false, err)
                  }
              }
              if .translated_dst_ip == null && .dport != null {
                  if !is_nullish(.dport) {
                      if is_string(.dport) {
                          temp = .dport
                          if temp != "0" {
                              temp = replace!(temp, r'^0*(?P<suffix>[0-9]+)', "$suffix")
                          }
                          temp, err = parse_int(temp)
                          if err == null {
                              .destination.port = temp
                          } else {
                              err_msg = join!(["Failed converting .dport to an integer. Found (", to_string!(.dport), "), ", to_string(err)], "")
                              assert!(false, err_msg)
                          }
                      } else {
                          if is_integer(.dport) {
                              .destination.port = .dport
                          } else {
                              err = "Failed converting .dport to an integer"
                              assert!(false, err)
                          }
                      }
                  } else {
                      err = ".dport must be present"
                      assert!(false, err)
                  }
              }
              if .protocol != null {
                  if .network.protocol == null {
                      .network.protocol = del(.protocol)
                  } else {
                      assert!(false, ".network.protocol must be null or override: true")
                  }
              } else {
                  assert!(false, ".protocol must not be null")
              }
          }
          if .cisco_meraki.event_type == "airmarshal_events" {
              _ingest.timestamp = now()
              if _ingest.pipeline == null {
                  _ingest.pipeline = "<no value>"
                  _ingest.on_failure_pipeline = "<no value>"
              }
              if .event.original != null {
                  tmp, err = parse_groks(value: .event.original, patterns: [s'^%{DATA} airmarshal_events type=%{DATA:type} %{DATA}$'])
                  if err == null {
                      . = merge(., tmp, deep: true)
                  } else {
                      assert!(false, "failed to dissect .event.original: " + to_string(err))
                  }
              } else {
                  err = ".event.original must not be nullish"
                  assert!(false, err)
              }
              if .type != null {
                  if .cisco_meraki.event_subtype == null {
                      .cisco_meraki.event_subtype = del(.type)
                  } else {
                      assert!(false, ".cisco_meraki.event_subtype must be null or override: true")
                  }
              } else {
                  assert!(false, ".type must not be null")
              }
              if !is_nullish(.event.original) {
                  value, err = parse_groks(value: .event.original, patterns: [s'.*?%{GREEDYDATA} ssid=%{QS:_temp.ssid}%{SPACE}%{GREEDYDATA:_temp.kvline}.*'])
                  if err == null {
                      . = merge(., value, deep: true)
                  } else {
                      assert!(false, "failed to grok .event.original:" + to_string(err))
                  }
              } else {
                  assert!(false, ".event.original must not be nullish")
              }
              if ._temp.ssid != null {
                  tmp, err = parse_groks(value: ._temp.ssid, patterns: [s'^\'%{DATA:_temp.kv.ssid}\'.*?$'])
                  if err == null {
                      . = merge(., tmp, deep: true)
                  } else {
                      assert!(false, "failed to dissect ._temp.ssid: " + to_string(err))
