# Generated by hyperi-rustlib deployment module
services:
  dfe-transform-vector:
    image: ghcr.io/hyperi-io/dfe-transform-vector:${DFE_TRANSFORM_VERSION:-latest}
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9090:9090"
      - "9000:9000"
      - "8686:8686"
    volumes:
      - ./config/config.yaml:/etc/dfe/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["dfe-transform-vector", "--config", "/etc/dfe/config.yaml"]

