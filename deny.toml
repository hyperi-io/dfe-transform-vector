# cargo-deny v0.19+ configuration
# Run: cargo deny check

[advisories]
ignore = []

[licenses]
allow = [
    "BUSL-1.1",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    # webpki-root-certs/webpki-roots (via reqwest -> rustls-platform-verifier)
    # relicensed MPL-2.0 -> CDLA-Permissive-2.0; the CCADB cert data is a
    # permissive data licence. Matches scalo's own deny.toml allowance.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
    # prometheus-parse 0.2.5 (latest, Dec 2023) pins itertools ^0.12; everything
    # else resolves to 0.14 through prost-derive. Nothing upstream to move to.
    { crate = "itertools@0.12.1", reason = "prometheus-parse 0.2.5 pins ^0.12" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary: the scalo branch patched in by Cargo.toml [patch.crates-io], until
# the release carrying it is on crates.io.
allow-git = ["https://github.com/hyperi-io/scalo-rs"]
