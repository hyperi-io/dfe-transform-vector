# cargo-deny v0.19+ configuration
# Run: cargo deny check

[advisories]
ignore = []

[licenses]
allow = [
    "BUSL-1.1",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    # webpki-root-certs/webpki-roots (via reqwest -> rustls-platform-verifier)
    # relicensed MPL-2.0 -> CDLA-Permissive-2.0; the CCADB cert data is a
    # permissive data licence. Matches rustlib's own deny.toml allowance.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
