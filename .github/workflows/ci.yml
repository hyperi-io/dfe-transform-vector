name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - ".gemini/**"
      - "hyperi-ai"
      - "hyperi-ai/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag to publish (e.g. v1.0.5)"

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/rust-ci.yml@8a81111605b0080d151e3a0dc41ce3ecb1cde3fd # main
    with:
      publish-target: both
      tag: ${{ inputs.tag || '' }}
    secrets: inherit
