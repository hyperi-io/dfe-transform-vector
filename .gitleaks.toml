# Project gitleaks allowlist: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positive allowlist"

paths = [
    '''(^|/)ci/''',
    '''(^|/)ai/''',
    # The Meraki event subtype '8021x_eap_failure' matches a key rule.
    '''pipelines/filebeat/filebeat\.yaml''',
]
