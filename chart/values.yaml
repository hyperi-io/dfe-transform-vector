# dfe-transform-vector Helm chart values
#
# Generated by scalo deployment module.
# Contract points validated by cargo test.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-transform-vector
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

# -- OTLP export target. Only consulted by an app built with scalo's
# otel features; ignored otherwise. Empty leaves the app's own default
# in place rather than switching anything off. Example:
# http://opentelemetry-collector.observability:4317
# Spans can carry request attributes, so keep this in-cluster. To leave
# the cluster use https:// and set the OTel SDK's certificate env vars.
otel:
  endpoint: ""
  protocol: grpc

# -- Pod-level security context. Matches the uid the generated image
# switches to; change both together or the container will not start.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. readOnlyRootFilesystem stays
# false because the spool and DLQ write to disk and the only volume
# mounted here is the read-only config map; set it true only for an
# app that spools nowhere.
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics service; /livez and /readyz are on this port too
service:
  type: ClusterIP
  port: 9090
  # -- The scalo Push listener, used on the direct transport only. 6000 is the
  # platform convention every DFE stage's listener follows.
  pushPort: 6000

# -- Application configuration (mounted as /etc/dfe-transform-vector/config.yaml)
config:
  pipeline:
    name: default
  source:
    # -- bus consumes topics; direct accepts pushes on listen
    transport: bus
    listen: 0.0.0.0:6000
    brokers:
    - kafka:9092
    topics:
    - raw_events
    group_id: dfe-transform-vector-default
    decoding:
      codec: json
    sasl:
      enabled: true
      mechanism: scram_sha_512
      # -- Where the Deployment mounts the kafka secret; Vector reads the
      # username and password files from it itself.
      secret_dir: /var/run/secrets/dfe-kafka
    tls:
      enabled: false
    # -- Commit an offset, or answer a push, only once the record is delivered.
    acknowledgements:
      enabled: true
  sink:
    # -- bus produces to topic; direct pushes to endpoint. topic still applies
    # on direct: it is the routing key the next stage picks its table by.
    transport: bus
    endpoint: http://dfe-loader:6000
    brokers:
    - kafka:9092
    topic: enriched_events
    key_field: .org_id
    encoding: json
    compression: zstd
    sasl:
      enabled: true
      mechanism: scram_sha_512
      secret_dir: /var/run/secrets/dfe-kafka
    tls:
      enabled: false
  # -- The two supervisor-to-Vector legs, used on the direct transport only.
  # Both live inside the pod, so both stay on loopback.
  bridge:
    to_vector: 127.0.0.1:6100
    from_vector: 127.0.0.1:6101
    batch_size: 500
  transforms:
    dir: /etc/dfe-transform-vector/transforms
  vector:
    binary: /usr/local/bin/vector
    data_dir: /var/lib/vector
    # -- Vector's API is unauthenticated and nothing here uses it. When turned
    # on it binds loopback only: reach it with kubectl port-forward.
    api_enabled: false
    api_address: 127.0.0.1:8686
    log_level: info
    version: 0.58.0
    version_check: warn
  metrics:
    address: 0.0.0.0:9090
    # -- Where Vector's prometheus_exporter binds. The wrapper scrapes it and
    # merges vector_* into the 9090 registry, so keep it on loopback: it is a
    # debug surface, not a scrape target, and needs no container port.
    vector_metrics_address: 127.0.0.1:9598
    # -- Scrape ticks a merged vector_* gauge may go unseen before it is zeroed,
    # so a component Vector drops stops reporting its last value.
    vector_metrics_expiry_ticks: 4
    # -- Seconds the sink may hold records without delivering any before
    # /readyz reports not ready. 0 never does.
    sink_stall_secs: 60
  logging:
    level: info
    format: json

# -- kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "1000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config)
    topic: ""
    # -- Override consumer group (default: from config)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
