# dfe-transform-vector Helm chart values
#
# Generated by hyperi-rustlib deployment module.
# Contract points validated by cargo test.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-transform-vector
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

# -- PodMonitor for Prometheus Operator
podMonitor:
  enabled: false
  additionalLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Persistent storage for Vector's data_dir, where disk buffers live.
#
# OPT-IN. Most deployments buffer in memory and need nothing here. Turn it on
# only when `config.sink.buffer.type` is `disk` -- and if you set that without
# turning this on, the chart refuses to template rather than handing you a
# buffer that silently loses events on reschedule.
#
# One claim per replica, via the StatefulSet's volumeClaimTemplates: a Vector
# disk buffer is per-process state and replicas must not share a volume.
#
# `size` is the only knob most deployments touch, and it must be at least the
# buffer's `max_size` (Vector's own floor is 256 MiB) with room for its index.
# Mounted at the path Vector already expects, so nothing else needs configuring.
#
# Provisioner-specific tuning (gp3 IOPS and throughput, for instance) is not
# here -- that belongs to the StorageClass, so point `storageClass` at one that
# carries it rather than expressing it per workload.
persistence:
  enabled: false
  # Doubles as the emptyDir sizeLimit when disabled, so a runaway buffer evicts
  # the pod instead of filling the node's disk.
  size: 2Gi
  accessMode: ReadWriteOnce
  # Empty means the cluster default StorageClass.
  storageClass: ""

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Init containers (e.g. Artifactory transform fetch)
initContainers: []

# -- Extra volumes to add to the pod
extraVolumes: []

# -- Extra volume mounts to add to the main container
extraVolumeMounts: []

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Application configuration (mounted as /etc/dfe-transform-vector/config.yaml)
config:
  health:
    address: 0.0.0.0:9000
  logging:
    format: json
    level: info
  metrics:
    address: 0.0.0.0:9090
    vector_metrics_address: 127.0.0.1:9598
  pipeline:
    name: default
  # -- Horizontal scaling-pressure engine (rustlib ScalingEngine, read from
  # this same file via rustlib's config cascade). This is a Vector
  # SUPERVISOR: Vector owns the Kafka consumer, not this process, so the
  # inbound transport is `other` (compound inbound = 0) and the smart
  # default reduces to CPU-driven (max(cpu/cpu_target, 0)) gated by the
  # Vector-subprocess circuit. A dead/crashed Vector subprocess opens the
  # circuit and pins scaling_pressure to 0 (more pods cannot help a down
  # subprocess). Vector-internal backlog/throughput as a domain signal is a
  # follow-up (the supervisor does not currently relay Vector's Prometheus
  # metrics). Kafka consumer-group lag is still seen EXTERNALLY by the KEDA
  # kafka trigger below.
  scaling:
    enabled: true
    interval_secs: 15
    transport:
      inbound: other
      outbound: other
    params:
      cpu_target: 0.70
  sink:
    brokers:
    - kafka:9092
    compression: zstd
    encoding: json
    key_field: .org_id
    message_timeout_ms: 300000
    socket_timeout_ms: 60000
    batch:
      max_events: 10000
      timeout_secs: 1
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
    topic: enriched_events
    buffer:
      type: memory
      max_events: 500
      when_full: block
    # -- librdkafka overrides (production defaults baked in, override here)
    # librdkafka_options:
    #   batch.size: "8388608"
  source:
    brokers:
    - kafka:9092
    decoding:
      codec: json
    group_id: dfe-transform-vector-default
    auto_offset_reset: largest
    session_timeout_ms: 30000
    commit_interval_ms: 5000
    topic_lag_metric: true
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
    topics:
    - raw_events
    # -- librdkafka overrides (production defaults baked in, override here)
    # librdkafka_options:
    #   fetch.max.bytes: "10485760"
  transforms:
    dir: /etc/dfe-transform-vector/transforms
  vector:
    api_address: 0.0.0.0:8686
    binary: /usr/local/bin/vector
    data_dir: /var/lib/vector
    log_level: info
    version: 0.48.0
    version_check: warn

# -- Kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "1000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config.source)
    topic: ""
    # -- Override consumer group (default: from config.source)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"
  # -- Optional Prometheus trigger on the rustlib scaling-pressure gauge.
  # OFF by default (the kafka lag + cpu triggers above are the primary
  # signal). When enabled, KEDA scales on the correlated composite the
  # supervisor emits: dfe_transform_vector_scaling_pressure (CPU-driven,
  # circuit-gated on Vector subprocess health). It is a 0-100 ratio, so
  # average it (avg + Value) -- NEVER sum a ratio. `serverAddress` is
  # CLUSTER-SPECIFIC: set it to your in-cluster Prometheus query endpoint.
  prometheus:
    enabled: false
    serverAddress: ""   # e.g. http://prometheus.monitoring.svc:9090
    threshold: "70"     # scale when avg pressure exceeds this (0-100)

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
