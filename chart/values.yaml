# dfe-transform-vector Helm chart values
#
# Generated by hyperi-rustlib deployment module.
# Contract points validated by cargo test.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-transform-vector
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Metrics and health endpoint service
service:
  type: ClusterIP
  port: 9090

# -- Application configuration (mounted as /etc/dfe/config.yaml)
config:
  health:
    address: 0.0.0.0:9000
  logging:
    format: json
    level: info
  metrics:
    address: 0.0.0.0:9090
    vector_metrics_address: 127.0.0.1:9598
  pipeline:
    name: default
  sink:
    brokers:
    - kafka:9092
    compression: zstd
    encoding: json
    key_field: .org_id
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
    topic: enriched_events
  source:
    brokers:
    - kafka:9092
    decoding:
      codec: json
    group_id: dfe-transform-vector-default
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
    topics:
    - raw_events
  transforms:
    dir: /etc/dfe/transforms
  vector:
    api_address: 0.0.0.0:8686
    binary: /usr/local/bin/vector
    data_dir: /var/lib/vector
    log_level: info
    version: 0.48.0
    version_check: warn

# -- kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "1000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config)
    topic: ""
    # -- Override consumer group (default: from config)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
