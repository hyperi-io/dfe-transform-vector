# dfe-transform-vector Helm chart values
#
# Big-dial configuration for Kafka-to-Kafka transform pipelines
# powered by Vector.dev as a managed subprocess.

# -- Number of replicas (ignored when KEDA is enabled)
replicaCount: 1

image:
  repository: harbor.devex.hyperi.io/dfe/dfe-transform-vector
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # -- If not set, name is generated from fullname
  name: ""

# -- Pod annotations (Prometheus scrape config included by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# -- Health endpoint service
service:
  type: ClusterIP
  healthPort: 9000
  metricsPort: 9090

# -- Vector data directory persistence
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# -- Graceful shutdown: 55s Vector drain + 5s wrapper + 5s buffer
terminationGracePeriodSeconds: 65

# -- Application configuration (mounted as /etc/dfe/config.yaml)
config:
  pipeline:
    name: default
  source:
    brokers:
      - kafka:9092
    topics:
      - raw_events
    group_id: dfe-transform-vector-default
    decoding:
      codec: json
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
  sink:
    brokers:
      - kafka:9092
    topic: enriched_events
    key_field: ".org_id"
    encoding: json
    compression: zstd
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: false
  transforms:
    dir: /etc/dfe/transforms
  vector:
    binary: /usr/local/bin/vector
    data_dir: /var/lib/vector
    api_address: 0.0.0.0:8686
    log_level: info
    version: "0.48.0"
    version_check: warn
  health:
    address: 0.0.0.0:9000
  metrics:
    address: 0.0.0.0:9090
    vector_metrics_address: 127.0.0.1:9598
  logging:
    level: info
    format: json

# -- User-supplied transform YAML files (mounted as ConfigMap)
# Each key is the filename, value is the YAML content.
transforms: {}
#  01_parse.yaml: |
#    transforms:
#      parse:
#        type: remap
#        inputs:
#          - dfe_source
#        source: |
#          . = parse_json!(.message)
#  02_enrich.yaml: |
#    transforms:
#      enrich:
#        type: remap
#        inputs:
#          - parse
#        source: |
#          .environment = "production"

# -- Kafka credentials
kafka:
  existingSecret: ""
  secretKeys:
    username: kafka-username
    password: kafka-password
  username: ""
  password: ""

# -- KEDA autoscaling (requires KEDA operator installed)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    # -- Scale when consumer group lag exceeds this per partition
    lagThreshold: "1000"
    # -- Wake from zero replicas when lag exceeds this
    activationLagThreshold: "0"
    # -- Override topic (default: first topic from config)
    topic: ""
    # -- Override consumer group (default: from config)
    consumerGroup: ""
  cpu:
    enabled: true
    # -- CPU utilisation percentage threshold
    threshold: "80"

# -- Standard HPA fallback (when KEDA is not installed)
# Mutually exclusive with keda.enabled
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# -- PodDisruptionBudget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- PodMonitor for Prometheus Operator
podMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
affinity: {}
