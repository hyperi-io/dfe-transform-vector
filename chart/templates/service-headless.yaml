{{/*
  Headless service backing the StatefulSet's `serviceName`.

  Required by the StatefulSet spec, and it is what gives each replica a stable
  DNS name. Not a substitute for the main service -- that one load-balances
  metrics and health scrapes; this one exists so individual pods are
  addressable, which matters when you need to reach one replica's Vector API to
  inspect its own buffer.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-transform-vector.fullname" . }}-headless
  labels:
    {{- include "dfe-transform-vector.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Pods are addressable before they pass readiness, so a replica whose sink is
  # backed up can still be reached to look at why.
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.port }}
      targetPort: health
      protocol: TCP
      name: health
    - port: {{ .Values.config.vector.api_address | default "0.0.0.0:8686" | trimPrefix "0.0.0.0:" | int }}
      targetPort: vector-api
      protocol: TCP
      name: vector-api
  selector:
    {{- include "dfe-transform-vector.selectorLabels" . | nindent 4 }}
