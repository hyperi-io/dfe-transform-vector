apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-transform-vector.fullname" . }}
  labels:
    {{- include "dfe-transform-vector.labels" . | nindent 4 }}
spec:
  {{- if not (or .Values.keda.enabled .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dfe-transform-vector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dfe-transform-vector.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dfe-transform-vector.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--config"
            - "/etc/dfe-transform-vector/config.yaml"
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if eq (default "bus" ((.Values.config).source).transport) "direct" }}
            - name: push
              containerPort: {{ .Values.service.pushPort | default 6000 }}
              protocol: TCP
            {{- end }}
          env:
            - name: OTEL_SERVICE_NAME
              value: "dfe-transform-vector"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME)
            {{- if (.Values.otel).endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.protocol | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/dfe-transform-vector
              readOnly: true
            # Kafka credentials as files. config.{source,sink}.sasl.secret_dir
            # names this path, and Vector's directory secret backend reads the
            # two files itself, so no credential reaches the environment, the
            # ConfigMap or the assembled Vector config.
            - name: kafka-credentials
              mountPath: /var/run/secrets/dfe-kafka
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-transform-vector.fullname" . }}-config
        - name: kafka-credentials
          secret:
            secretName: {{ include "dfe-transform-vector.kafkaSecretName" . }}
            # Group-readable: the kubelet gives the files fsGroup, and the
            # container runs as that group.
            defaultMode: 0440
            items:
              - key: {{ .Values.kafka.secretKeys.username }}
                path: username
              - key: {{ .Values.kafka.secretKeys.password }}
                path: password
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
