{{/*
  A StatefulSet, not a Deployment, because a Vector disk buffer is PER-PROCESS
  state. Replicas cannot share one volume without corrupting each other's
  buffer, so each needs its own claim -- which is what volumeClaimTemplates
  gives and a Deployment cannot.

  Enabling `sink.buffer.type: disk` without a persistent volume used to write
  the buffer into the container's writable layer: every write succeeded, nothing
  errored, and the buffered events vanished on reschedule. The durability the
  disk buffer exists to provide was silently absent. `persistenceRequired`
  below refuses to template that combination now.

  podManagementPolicy Parallel: this is a shared-nothing transform pipeline, so
  ordered boot buys nothing and costs scale-up latency under KEDA.
*/}}
{{- include "dfe-transform-vector.persistenceRequired" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dfe-transform-vector.fullname" . }}
  labels:
    {{- include "dfe-transform-vector.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "dfe-transform-vector.fullname" . }}-headless
  podManagementPolicy: Parallel
  {{- if not (or .Values.keda.enabled .Values.autoscaling.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dfe-transform-vector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dfe-transform-vector.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ include "dfe-transform-vector.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/dfe-transform-vector/config.yaml"
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: health
              containerPort: 9000
              protocol: TCP
            - name: vector-api
              containerPort: 8686
              protocol: TCP
          env:
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-transform-vector.kafkaSecretName" . }}
                  key: {{ .Values.kafka.secretKeys.username }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-transform-vector.kafkaSecretName" . }}
                  key: {{ .Values.kafka.secretKeys.password }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/dfe-transform-vector
              readOnly: true
            # Vector's data_dir -- where disk buffers live. Always mounted, so
            # the buffer never lands in the container's writable layer even when
            # persistence is off.
            - name: vector-data
              mountPath: {{ .Values.config.vector.data_dir | default "/var/lib/vector" }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dfe-transform-vector.fullname" . }}-config
        {{- if not .Values.persistence.enabled }}
        # No claim requested, so give data_dir an explicit emptyDir rather than
        # letting it fall through to the writable layer. sizeLimit caps it so a
        # runaway buffer evicts this pod instead of filling the node's disk.
        - name: vector-data
          emptyDir:
            sizeLimit: {{ .Values.persistence.size }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  # One claim PER REPLICA. Retained on scale-down (the default) so buffered
  # events are not discarded by an autoscaler decision.
  volumeClaimTemplates:
    - metadata:
        name: vector-data
        labels:
          {{- include "dfe-transform-vector.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
