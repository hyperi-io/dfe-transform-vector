{{- /*
  HAND-EDITED -- do NOT overwrite this file with `emit-chart` output.

  The generator binds the username to `sasl`. KEDA's kafka scaler reads `sasl`
  as the mechanism enum and takes the principal in `username`, so a regenerated
  TriggerAuthentication supplies no username and the scaler answers "no username
  given" instead of a lag metric. Guarded by the
  `checked_in_keda_triggerauth_survives_emit_chart` integration test.
*/}}
{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "dfe-transform-vector.fullname" . }}-kafka-auth
  labels:
    {{- include "dfe-transform-vector.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: username
      name: {{ include "dfe-transform-vector.kafkaSecretName" . }}
      key: {{ .Values.kafka.secretKeys.username }}
    - parameter: password
      name: {{ include "dfe-transform-vector.kafkaSecretName" . }}
      key: {{ .Values.kafka.secretKeys.password }}
{{- end }}
