{{- /*
  HAND-EDITED -- do NOT overwrite this file with `emit-chart` output.

  The generator addresses the Kafka trigger through `.Values.config.kafka.*`.
  This app names its consumer side `config.source`, has no `config.kafka` block,
  and takes a broker LIST rather than a string. Regenerating renders empty
  bootstrapServers, consumerGroup and topic, which KEDA accepts and then never
  scales on. Guarded by the `checked_in_keda_scaledobject_survives_emit_chart`
  integration test.

  The addressing and the sasl/tls lines both diverge from the generator, which
  hardcodes them. Every other line tracks it and must be carried across by hand
  when scalo changes it, because the exemption stops `emit-chart` from
  delivering it here.
*/}}
{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "dfe-transform-vector.fullname" . }}
  labels:
    {{- include "dfe-transform-vector.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "dfe-transform-vector.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers:
    # Kafka consumer group lag (primary scaler)
    - type: kafka
      authenticationRef:
        name: {{ include "dfe-transform-vector.fullname" . }}-kafka-auth
      metadata:
        bootstrapServers: {{ join "," .Values.config.source.brokers | quote }}
        consumerGroup: {{ .Values.keda.kafka.consumerGroup | default .Values.config.source.group_id | quote }}
        {{- /* `default (index X 0)` would eagerly evaluate `index nil 0` and fail
            lint when no topics are set. Use explicit conditional instead. */}}
        {{- if .Values.keda.kafka.topic }}
        topic: {{ .Values.keda.kafka.topic | quote }}
        {{- else if .Values.config.source.topics }}
        topic: {{ (index .Values.config.source.topics 0) | quote }}
        {{- else }}
        topic: ""
        {{- end }}
        lagThreshold: {{ .Values.keda.kafka.lagThreshold | quote }}
        activationLagThreshold: {{ .Values.keda.kafka.activationLagThreshold | quote }}
        {{- /* KEDA reads `sasl`, not `saslType`, and its enum spells the
            mechanisms without the underscore the app config uses. These track
            the app's own source config so the scaler dials the broker the way
            the app does.

            `sasl` and `tls` are optional to the app (SourceConfig is
            serde(default)), so reach them through the nil-safe parenthesised
            form or an operator who omits either block gets a Helm render
            error instead of a chart. Compare against "true" rather than
            leaning on Go truthiness, which reads a quoted "false" as true. */}}
        {{- $mechanisms := dict "plain" "plaintext" "scram_sha_256" "scram_sha256" "scram_sha_512" "scram_sha512" }}
        {{- $configured := (.Values.config.source.sasl).mechanism | default "scram_sha_512" }}
        sasl: {{ if eq ((.Values.config.source.sasl).enabled | toString) "true" }}{{ required (printf "keda: no KEDA sasl mechanism for %q" $configured) (get $mechanisms $configured) }}{{ else }}none{{ end }}
        tls: {{ if eq ((.Values.config.source.tls).enabled | toString) "true" }}enable{{ else }}disable{{ end }}
        {{- /* The app turns skip_verify into enable.ssl.certificate.verification=false.
            Without the matching dial KEDA is stricter than the app it scales, and a
            private-CA broker the app talks to fine fails verification here. */}}
        unsafeSsl: {{ (.Values.config.source.tls).skip_verify | default false | quote }}
    {{- if .Values.keda.cpu.enabled }}
    # CPU utilisation (secondary scaler)
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.keda.cpu.threshold | quote }}
    {{- end }}
{{- end }}
