$schema: https://json-schema.org/draft/2020-12/schema
title: Config
description: |-
  Main configuration.

  ## Hot-reload behaviour

  **Hot-reloaded (takes effect on next poll cycle / SIGHUP):**
  - Transform YAML file contents (modified/added/removed in watched directory)
  - `transforms.dir` — watcher switches to new directory after successful reload
  - `transforms.files` — watcher switches to new file list after successful reload

  **Requires pod restart:**
  - `source.*` — Kafka consumer connections established at Vector startup
  - `sink.*` — Kafka producer connections established at Vector startup
  - `pipeline.name` — used in consumer group_id and metrics labels at startup
  - `vector.*` — binary path, data_dir, config_dir, API address, log level
    set at Vector spawn
  - `metrics.*` — HTTP server binds at startup
  - `logging.*` — tracing subscriber configured at startup
  - `scaling.*` — the scalo `ScalingEngine` reads the `scaling:` block
    from the cascade at startup (via run_app's `config::setup()`); the
    app's own `ScalingConfig.pressure_threshold` is the legacy KEDA knob.
    Engine fields (`enabled`/`interval_secs`/`transport`/`params`) are
    honoured by scalo and ignored by this struct (and vice-versa).
  - `reload.poll_interval_secs` — captured at reload loop start
type: object
properties:
  dfe_source:
    description: |-
      DFE source name (e.g. `"syslog"`, `"netflow"`).

      When set, derives defaults for fields not explicitly configured:
      - `source.topics` → `["{dfe_source}_land"]`
      - `sink.topic` → `"{dfe_source}_load"`
      - `source.group_id` → `"dfe-transform-vector-{dfe_source}"`

      Explicit values always override the derived defaults.
      See [`KafkaSource`] for the platform topic naming convention.
    type:
    - string
    - 'null'
    default: null
  pipeline:
    description: Pipeline identity. **Requires restart.**
    $ref: '#/$defs/PipelineConfig'
    default:
      name: default
  source:
    description: Kafka source (input). **Requires restart.**
    $ref: '#/$defs/SourceConfig'
    default:
      brokers:
      - localhost:9092
      topics:
      - events
      group_id: dfe-transform-vector
      decoding:
        codec: json
      sasl:
        enabled: false
        mechanism: scram_sha_512
        username: ''
        password: ''
      tls:
        enabled: false
        ca_cert_file: null
        cert_file: null
        key_file: null
        skip_verify: false
      auto_offset_reset: largest
      session_timeout_ms: 30000
      commit_interval_ms: 5000
      drain_timeout_ms: null
      topic_lag_metric: true
      librdkafka_options: {}
  sink:
    description: Kafka sink (output). **Requires restart.**
    $ref: '#/$defs/SinkConfig'
    default:
      brokers:
      - localhost:9092
      topic: ''
      key_field: ''
      encoding: json
      compression: none
      sasl:
        enabled: false
        mechanism: scram_sha_512
        username: ''
        password: ''
      tls:
        enabled: false
        ca_cert_file: null
        cert_file: null
        key_file: null
        skip_verify: false
      buffer:
        type: memory
        max_events: null
        max_size: null
        when_full: block
      batch:
        max_events: 10000
        max_bytes: null
        timeout_secs: 1
      message_timeout_ms: 300000
      socket_timeout_ms: 60000
      librdkafka_options: {}
  transforms:
    description: User-supplied transform YAML files. **Hot-reloaded.**
    $ref: '#/$defs/TransformConfig'
    default:
      dir: null
      files: null
  vector:
    description: Vector subprocess settings. **Requires restart.**
    $ref: '#/$defs/VectorConfig'
    default:
      binary: /usr/local/bin/vector
      data_dir: /var/lib/vector
      config_dir: /var/run/vector/config
      api_address: 0.0.0.0:8686
      log_level: info
      version: 0.57.0
      version_check: strict
      version_source: preshipped
      cache_dir: /var/cache/vector
  metrics:
    description: Metrics endpoint. **Requires restart** (server binds at startup).
    $ref: '#/$defs/MetricsConfig'
    default:
      address: 0.0.0.0:9090
      vector_metrics_address: 127.0.0.1:9598
  logging:
    description: Logging. **Requires restart** (subscriber configured at startup).
    $ref: '#/$defs/LoggingConfig'
    default:
      level: info
      format: json
  scaling:
    description: KEDA scaling pressure. **Requires restart.**
    $ref: '#/$defs/ScalingConfig'
    default:
      pressure_threshold: 0.8
  reload:
    description: Hot-reload configuration. **Requires restart** (poll interval captured at start).
    $ref: '#/$defs/ReloadConfig'
    default:
      enabled: true
      poll_interval_secs: 30
$defs:
  PipelineConfig:
    description: Pipeline identity.
    type: object
    properties:
      name:
        description: Pipeline name (used in metrics labels, Kafka group_id, logging).
        type: string
        default: default
  SourceConfig:
    description: Kafka source configuration (input big dials).
    type: object
    properties:
      brokers:
        description: Kafka bootstrap servers.
        type: array
        items:
          type: string
        default:
        - localhost:9092
      topics:
        description: Topics to consume from.
        type: array
        items:
          type: string
        default:
        - events
      group_id:
        description: Consumer group ID.
        type: string
        default: dfe-transform-vector
      decoding:
        description: Message decoding.
        $ref: '#/$defs/DecodingConfig'
        default:
          codec: json
      sasl:
        description: SASL authentication.
        $ref: '#/$defs/SaslConfig'
        default:
          enabled: false
          mechanism: scram_sha_512
          username: ''
          password: ''
      tls:
        description: TLS configuration.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          ca_cert_file: null
          cert_file: null
          key_file: null
          skip_verify: false
      auto_offset_reset:
        description: 'Auto offset reset: `largest` (default) or `smallest`.'
        type: string
        default: largest
      session_timeout_ms:
        description: 'Session timeout (ms). Default: 30000.'
        type: integer
        format: uint32
        minimum: 0
        default: 30000
      commit_interval_ms:
        description: 'Offset commit interval (ms). Default: 5000.'
        type: integer
        format: uint32
        minimum: 0
        default: 5000
      drain_timeout_ms:
        description: |-
          Drain timeout (ms) — max wait for pending acks during shutdown/rebalance.
          Must be less than session_timeout_ms. Default: half of session_timeout_ms.
        type:
        - integer
        - 'null'
        format: uint32
        minimum: 0
        default: null
      topic_lag_metric:
        description: 'Expose per-topic consumer lag metric. Default: true.'
        type: boolean
        default: true
      librdkafka_options:
        description: Extra librdkafka options (passed through to Vector).
        type: object
        additionalProperties:
          type: string
        default: {}
  DecodingConfig:
    description: Message decoding configuration.
    type: object
    properties:
      codec:
        description: 'Codec: json, raw_bytes, protobuf.'
        type: string
        default: json
  SaslConfig:
    description: |-
      SASL authentication for Kafka.

      NOTE: `password` is `String`, not `SensitiveString`, because the config
      goes through a figment serialize→merge→deserialize round-trip in
      `apply_figment_env()`. `SensitiveString` serialises as `***REDACTED***`
      which destroys the value during the round-trip. Password protection is
      handled by: (1) `flat_env_string_sensitive` which masks the env var in
      logs, and (2) the generated Vector YAML using `${KAFKA_SASL_PASSWORD}`
      env-var interpolation — the actual secret never appears in our config.
    type: object
    properties:
      enabled:
        description: Enable SASL authentication.
        type: boolean
        default: false
      mechanism:
        description: 'SASL mechanism: plain, scram_sha_256, scram_sha_512.'
        type: string
        default: scram_sha_512
      username:
        description: 'SASL username. Supports Vector env interpolation: `${KAFKA_SASL_USERNAME}`.'
        type: string
        default: ''
      password:
        description: 'SASL password. Supports Vector env interpolation: `${KAFKA_SASL_PASSWORD}`.'
        type: string
        default: ''
  TlsConfig:
    description: TLS configuration for Kafka.
    type: object
    properties:
      enabled:
        description: Enable TLS.
        type: boolean
        default: false
      ca_cert_file:
        description: Path to CA certificate PEM file.
        type:
        - string
        - 'null'
        default: null
      cert_file:
        description: Path to client certificate PEM file (for mTLS).
        type:
        - string
        - 'null'
        default: null
      key_file:
        description: Path to client key PEM file (for mTLS).
        type:
        - string
        - 'null'
        default: null
      skip_verify:
        description: Skip hostname verification (dev/test only).
        type: boolean
        default: false
  SinkConfig:
    description: Kafka sink configuration (output big dials).
    type: object
    properties:
      brokers:
        description: Kafka bootstrap servers.
        type: array
        items:
          type: string
        default:
        - localhost:9092
      topic:
        description: Output topic name.
        type: string
        default: ''
      key_field:
        description: Event field path for Kafka partition key (e.g., ".org_id").
        type: string
        default: ''
      encoding:
        description: 'Encoding codec: json, raw_bytes.'
        type: string
        default: json
      compression:
        description: 'Compression: none, gzip, lz4, snappy, zstd.'
        type: string
        default: none
      sasl:
        description: SASL authentication.
        $ref: '#/$defs/SaslConfig'
        default:
          enabled: false
          mechanism: scram_sha_512
          username: ''
          password: ''
      tls:
        description: TLS configuration.
        $ref: '#/$defs/TlsConfig'
        default:
          enabled: false
          ca_cert_file: null
          cert_file: null
          key_file: null
          skip_verify: false
      buffer:
        description: Sink buffer configuration.
        $ref: '#/$defs/BufferConfig'
        default:
          type: memory
          max_events: null
          max_size: null
          when_full: block
      batch:
        description: Sink batch configuration (Vector-level batching).
        $ref: '#/$defs/BatchConfig'
        default:
          max_events: 10000
          max_bytes: null
          timeout_secs: 1
      message_timeout_ms:
        description: 'Local message timeout (ms). Default: 300000 (5 min).'
        type: integer
        format: uint32
        minimum: 0
        default: 300000
      socket_timeout_ms:
        description: 'Network request timeout (ms). Default: 60000 (60s).'
        type: integer
        format: uint32
        minimum: 0
        default: 60000
      librdkafka_options:
        description: Extra librdkafka options (passed through to Vector).
        type: object
        additionalProperties:
          type: string
        default: {}
  BufferConfig:
    description: |-
      Buffer configuration for Vector sinks.

      Supports two modes:
      - `memory`: in-memory buffer (default), configured by `max_events`
      - `disk`: persistent disk buffer, configured by `max_size` (bytes, min ~256 MiB)
    type: object
    properties:
      type:
        description: 'Buffer type: `memory` or `disk`.'
        type: string
        default: memory
      max_events:
        description: 'Maximum events in memory buffer (only for type=memory). Default: 500.'
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
      max_size:
        description: Maximum buffer size in bytes (only for type=disk). Min ~256 MiB (268435488).
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
      when_full:
        description: 'Behaviour when buffer is full: `block` (default) or `drop_newest`.'
        type: string
        default: block
  BatchConfig:
    description: Vector-level batch configuration for sinks.
    type: object
    properties:
      max_events:
        description: 'Maximum events per batch before flush. Default: 10000.'
        type: integer
        format: uint32
        minimum: 0
        default: 10000
      max_bytes:
        description: Maximum uncompressed batch size (bytes) before flush.
        type:
        - integer
        - 'null'
        format: uint64
        minimum: 0
        default: null
      timeout_secs:
        description: 'Max batch age (seconds) before flush. Default: 1.'
        type: integer
        format: uint32
        minimum: 0
        default: 1
  TransformConfig:
    description: Transform file loading configuration.
    type: object
    properties:
      dir:
        description: Directory to load all YAML transform files from.
        type:
        - string
        - 'null'
        default: null
      files:
        description: Explicit list of transform YAML file paths (loaded in order).
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
  VectorConfig:
    description: Vector subprocess configuration.
    type: object
    properties:
      binary:
        description: Path to Vector binary.
        type: string
        default: /usr/local/bin/vector
      data_dir:
        description: Data directory for disk buffers and state.
        type: string
        default: /var/lib/vector
      config_dir:
        description: |-
          Directory the assembled Vector config is written to.

          Defaults to the container path. A deployment that is not the image --
          a bare install, or a test driving the binary directly -- has no write
          access there and must point this somewhere it owns.
        type: string
        default: /var/run/vector/config
      api_address:
        description: Vector API server address (host:port).
        type: string
        default: 0.0.0.0:8686
      log_level:
        description: Vector log level.
        type: string
        default: info
      version:
        description: |-
          Expected Vector version (semver).

          Defaults to the version the image was built with
          ([`crate::deployment::VECTOR_VERSION`]) rather than empty:
          [`check_vector_version`](crate::config::validate::check_vector_version)
          skips the comparison on an empty pin, which would make the default
          `version_check: strict` a check that cannot fire. With the default pin,
          strict means the binary on PATH must be the one this image shipped.

          Set it explicitly (or set `version_check` to `warn`/`disabled`) when
          deliberately running a different Vector to the pre-shipped one.
        type: string
        default: 0.57.0
      version_check:
        description: 'Version check mode: strict, warn, disabled.'
        type: string
        default: strict
      version_source:
        description: |-
          Where the Vector version comes from: `preshipped`, `latest`, `stable`,
          a minor line (`0.56`), or an exact version (`0.56.0`).

          Defaults to `preshipped` -- the binary baked into the image. It needs no
          network, is the version this build was tested against, and is the only
          mode that works on a cold airgapped deploy.

          See [`crate::vector::VersionSource`].
        type: string
        default: preshipped
      cache_dir:
        description: |-
          Persistent cache directory for Vector binaries.

          Deliberately OUTSIDE the container's writable layer -- mount a k8s
          volume or a docker bind here so it survives pod restarts and image
          pulls. Pre-populate it to run a non-pre-shipped version in an airgapped
          environment.
        type: string
        default: /var/cache/vector
  MetricsConfig:
    description: Metrics endpoint configuration.
    type: object
    properties:
      address:
        description: Metrics server bind address (host:port).
        type: string
        default: 0.0.0.0:9090
      vector_metrics_address:
        description: Vector's prometheus_exporter address to proxy (host:port).
        type: string
        default: 127.0.0.1:9598
  LoggingConfig:
    description: Logging configuration.
    type: object
    properties:
      level:
        description: Log level (trace, debug, info, warn, error).
        type: string
        default: info
      format:
        description: Log format (json, text).
        type: string
        default: json
  ScalingConfig:
    description: KEDA scaling pressure configuration.
    type: object
    properties:
      pressure_threshold:
        description: Scaling pressure threshold (0.0–1.0).
        type: number
        format: double
        default: 0.8
  ReloadConfig:
    description: Hot-reload configuration.
    type: object
    properties:
      enabled:
        description: Enable hot-reload (poll-based file watcher + SIGHUP).
        type: boolean
        default: true
      poll_interval_secs:
        description: Poll interval in seconds for detecting config/transform file changes.
        type: integer
        format: uint64
        minimum: 0
        default: 30
