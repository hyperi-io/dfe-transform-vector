# =============================================================================
# dfe-transform-vector — example configuration
# =============================================================================
#
# Copy to config.yaml and modify as needed.
#
# Configuration cascade (highest to lowest priority):
#   1. CLI args (--config, --log-level, etc.)
#   2. Environment variables (DFE_TRANSFORM_*)
#   3. .env file
#   4. Config file (this file)
#   5. Hard-coded defaults

# -----------------------------------------------------------------------------
# Pipeline identity
# -----------------------------------------------------------------------------
pipeline:
  name: "my-pipeline"

# -----------------------------------------------------------------------------
# Source: the bus (Kafka topics) or direct (a scalo Push listener)
# -----------------------------------------------------------------------------
# One deployment runs one transport. On `direct` there is no broker: the
# receiver or the fetcher pushes records straight at `listen`, and the
# brokers/topics/group_id below are unused. See templates/bus.yaml and
# templates/direct.yaml for the Vector pipeline each one produces.
# source:
#   transport: "bus"                   # bus | direct
#   listen: "0.0.0.0:6000"             # direct only: the Push listener address
#   brokers:
#     - "localhost:9092"
#   topics:
#     - "raw_events_land"
#   group_id: "dfe-transform-vector-my-pipeline"
#   decoding:
#     codec: "json"                    # json, raw_bytes, protobuf
#   auto_offset_reset: "largest"       # largest, smallest
#   session_timeout_ms: 30000          # consumer group session timeout
#   commit_interval_ms: 5000           # offset commit interval
#   drain_timeout_ms: 15000            # max wait during rebalance (default: half session_timeout)
#   topic_lag_metric: true             # expose consumer lag metric
#   sasl:
#     enabled: true
#     mechanism: "scram_sha_512"       # plain, scram_sha_256, scram_sha_512
#     username: "${KAFKA_SASL_USERNAME}"
#     password: "${KAFKA_SASL_PASSWORD}"
#   tls:
#     enabled: true
#   # librdkafka overrides — production defaults baked in, override here
#   # librdkafka_options:
#   #   fetch.max.bytes: "10485760"
#   #   queued.min.messages: "100000"

# -----------------------------------------------------------------------------
# Sink: the bus (a Kafka topic) or direct (the next stage's Push listener)
# -----------------------------------------------------------------------------
# `topic` still applies on direct: it is the routing key the next stage picks
# its table by, so a source keeps its name across the hop.
# sink:
#   transport: "bus"                   # bus | direct
#   endpoint: "http://dfe-loader:6000" # direct only: where the records go next
#   brokers:
#     - "localhost:9092"
#   topic: "enriched_events_land"
#   key_field: ".org_id"               # Event field to use as Kafka partition key
#   encoding: "json"                   # json, raw_bytes
#   compression: "zstd"               # none, gzip, lz4, snappy, zstd
#   message_timeout_ms: 300000         # producer delivery timeout
#   socket_timeout_ms: 60000           # broker socket timeout
#   batch:
#     max_events: 10000                # Vector-level batch size (default 10K)
#     # max_bytes: 8388608             # optional byte limit
#     timeout_secs: 1                  # flush timeout
#   sasl:
#     enabled: true
#     mechanism: "scram_sha_512"
#     username: "${KAFKA_SASL_USERNAME}"
#     password: "${KAFKA_SASL_PASSWORD}"
#   tls:
#     enabled: true
#   # librdkafka overrides — production defaults baked in, override here
#   # librdkafka_options:
#   #   batch.size: "8388608"
#   #   linger.ms: "20"

# -----------------------------------------------------------------------------
# The two supervisor-to-Vector legs (direct transport only)
# -----------------------------------------------------------------------------
# Vector does not speak scalo's Push protocol, so on `direct` the supervisor
# translates: it hands records to Vector over `to_vector` and takes them back
# over `from_vector`, then pushes them to sink.endpoint. Both live inside one
# pod, so both stay on loopback. Change them only where something else on the
# pod already holds a port.
# bridge:
#   to_vector: "127.0.0.1:6100"        # Vector's own `vector` source binds here
#   from_vector: "127.0.0.1:6101"      # the supervisor's listener binds here
#   batch_size: 500                    # records moved per hop

# -----------------------------------------------------------------------------
# Transform files (user-supplied Vector transform YAML)
# -----------------------------------------------------------------------------
# transforms:
#   dir: "/etc/dfe/transforms/"
#   # Or specify individual files (loaded in order):
#   # files:
#   #   - "/etc/dfe/transforms/parse.yaml"
#   #   - "/etc/dfe/transforms/enrich.yaml"
#   #   - "/etc/dfe/transforms/filter.yaml"

# -----------------------------------------------------------------------------
# Vector subprocess settings
# -----------------------------------------------------------------------------
# vector:
#   binary: "/usr/local/bin/vector"
#   data_dir: "/var/lib/vector"
#   # Where the assembled Vector config is written. The default is the
#   # container path; a bare install has no write access there.
#   config_dir: "/var/run/vector/config"
#   api_address: "0.0.0.0:8686"
#   log_level: "info"
#   # Version pinning — prevents silent version drift
#   version: "0.57.0"
#   version_check: "strict"           # strict, warn, disabled

# -----------------------------------------------------------------------------
# Metrics endpoint
# -----------------------------------------------------------------------------
# Also serves /livez and /readyz -- the whole probe surface is on this port,
# and it carries Vector's own vector_* as well: the wrapper scrapes the
# exporter below and merges the samples into this registry.
# metrics:
#   address: "0.0.0.0:9090"
#   # Where Vector's prometheus_exporter binds. Loopback -- the wrapper is its
#   # only reader, so nothing outside the pod needs the port.
#   vector_metrics_address: "127.0.0.1:9598"
#   # Scrape ticks a merged vector_* gauge may go unseen before it is zeroed.
#   vector_metrics_expiry_ticks: 4

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "info"                        # trace, debug, info, warn, error
  format: "json"                       # json, text

# -----------------------------------------------------------------------------
# Scaling pressure
# -----------------------------------------------------------------------------
# The `scaling:` block is shared by TWO readers on the same key:
#   - rustlib's horizontal ScalingEngine (enabled / interval_secs /
#     transport / params) -- read from the cascade at startup.
#   - this wrapper's legacy KEDA knob (pressure_threshold).
# Each ignores the other's fields.
#
# This is a Vector SUPERVISOR: Vector owns the Kafka consumer, not this
# process, so inbound transport is `other` and the smart default reduces
# to CPU-driven, gated by Vector subprocess health (circuit opens when
# Vector is down). Kafka consumer-group lag is still seen externally by
# the KEDA kafka trigger. Relaying Vector-internal backlog as a domain
# scaling signal is a follow-up.
# scaling:
#   enabled: true
#   interval_secs: 15
#   transport:
#     inbound: other
#     outbound: other
#   params:
#     cpu_target: 0.70
#   # legacy KEDA knob (this wrapper only):
#   pressure_threshold: 0.8
