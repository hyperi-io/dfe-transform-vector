# dfe-transform-vector common Helm values
#
# Shared values applied to all dfe-transform-vector pipeline deployments.
# Pipeline-specific overrides live in the pipelines repo.
#
# (c) HyperI 2026

replicaCount: 1

image:
  repository: ghcr.io/hyperi-io/dfe-transform-vector
  pullPolicy: IfNotPresent
  tag: ""
  pullSecrets:
    - name: docker-registry-secret

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 2Gi

service:
  type: ClusterIP
  port: 9090

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podMonitor:
  enabled: true
  additionalLabels:
    release: prometheus

# Kafka credentials from ExternalSecret
kafka:
  existingSecret: kafka-sasl-secret
  secretKeys:
    username: KAFKA_SASL_USERNAME
    password: KAFKA_SASL_PASSWORD

# KEDA autoscaling (KEDA operator required)
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  kafka:
    lagThreshold: "1000"
    activationLagThreshold: "0"
  cpu:
    enabled: true
    threshold: "80"

# HPA disabled when KEDA is active
autoscaling:
  enabled: false

# Common config defaults — pipeline-specific values override these
config:
  health:
    address: 0.0.0.0:9000
  logging:
    format: json
    level: info
  metrics:
    address: 0.0.0.0:9090
    vector_metrics_address: 127.0.0.1:9598
  source:
    decoding:
      codec: json
    auto_offset_reset: largest
    session_timeout_ms: 30000
    commit_interval_ms: 5000
    topic_lag_metric: true
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: true
  sink:
    encoding: json
    compression: zstd
    key_field: .org_id
    message_timeout_ms: 300000
    socket_timeout_ms: 60000
    batch:
      max_events: 10000
      timeout_secs: 1
    sasl:
      enabled: true
      mechanism: scram_sha_512
    tls:
      enabled: true
    buffer:
      type: memory
      max_events: 500
      when_full: block
  transforms:
    dir: /etc/dfe/transforms
  vector:
    binary: /usr/local/bin/vector
    data_dir: /var/lib/vector
    api_address: 0.0.0.0:8686
    log_level: info
    version: "0.48.0"
    version_check: warn

# Init container to fetch transform YAMLs from Artifactory
initContainers:
  - name: fetch-transforms
    image: alpine/curl:latest
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh"]
    args:
      - -c
      - |
        if [ -z "$VERSION" ]; then
          export VERSION="latest"
          echo "VERSION not defined, using default: latest"
        else
          echo "Using VERSION: $VERSION"
        fi
        echo "Fetching transform templates from artefact repository"
        curl -u ${ARTIFACTORY_USERNAME}:${ARTIFACTORY_PASSWORD} -L -o /tmp/download.zip ${ARTIFACTORY_VECTOR_TEMPLATES}/vector-artifacts/artifacts-$VERSION.zip
        unzip -o /tmp/download.zip -d /etc/dfe/transforms
        echo "Transform templates download complete"
        rm -rf /tmp/download.zip
    envFrom:
      - secretRef:
          name: tenant-artifactory
    volumeMounts:
      - name: transforms
        mountPath: "/etc/dfe/transforms"

extraVolumes:
  - name: transforms
    emptyDir: {}

extraVolumeMounts:
  - name: transforms
    mountPath: "/etc/dfe/transforms"
