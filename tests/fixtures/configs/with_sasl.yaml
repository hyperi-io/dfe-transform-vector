# Test fixture: config with SASL/SCRAM + TLS on both source and sink.
# The credentials are files in a mounted directory, which Vector's directory
# secret backend reads, so none is written into the config.

pipeline:
  name: "sasl-pipeline"

source:
  brokers:
    - "kafka.example.com:9094"
  topics:
    - "secure.input"
  group_id: "secure-group"
  decoding:
    codec: "json"
  sasl:
    enabled: true
    mechanism: "scram_sha_512"
    secret_dir: "/var/run/secrets/dfe-kafka"
  tls:
    enabled: true

sink:
  brokers:
    - "kafka.example.com:9094"
  topic: "secure.output"
  key_field: ".org_id"
  encoding: "json"
  compression: "zstd"
  sasl:
    enabled: true
    mechanism: "scram_sha_512"
    secret_dir: "/var/run/secrets/dfe-kafka"
  tls:
    enabled: true

vector:
  binary: "/usr/local/bin/vector"
  data_dir: "/tmp/vector-test-data"
  version_check: "disabled"
