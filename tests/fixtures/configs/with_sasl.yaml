# Test fixture: config with SASL/SCRAM + TLS on both source and sink.
# Tests that SASL credentials are passed through as Vector env-var references.

pipeline:
  name: "sasl-pipeline"

source:
  brokers:
    - "kafka.example.com:9094"
  topics:
    - "secure.input"
  group_id: "secure-group"
  decoding:
    codec: "json"
  sasl:
    enabled: true
    mechanism: "SCRAM-SHA-512"
    username: "${KAFKA_SASL_USERNAME}"
    password: "${KAFKA_SASL_PASSWORD}"
  tls:
    enabled: true

sink:
  brokers:
    - "kafka.example.com:9094"
  topic: "secure.output"
  key_field: ".org_id"
  encoding: "json"
  compression: "zstd"
  sasl:
    enabled: true
    mechanism: "SCRAM-SHA-512"
    username: "${KAFKA_SASL_USERNAME}"
    password: "${KAFKA_SASL_PASSWORD}"
  tls:
    enabled: true

vector:
  binary: "/usr/local/bin/vector"
  data_dir: "/tmp/vector-test-data"
  version_check: "disabled"
