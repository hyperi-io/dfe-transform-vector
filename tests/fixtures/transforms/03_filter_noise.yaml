# Fixture: 03_filter_noise
#
# Drop health-check pings and empty events before forwarding.
# Events that match are silently discarded; all others pass through.
#
# Inputs: auto-wired

transforms:
  filter_noise:
    type: filter
    inputs:
      - enrich_metadata
    condition:
      type: vrl
      source: |
        path = to_string(.path) ?? ""
        event_type = to_string(.event_type) ?? ""
        !match(path, r'^/health') &&
        !match(event_type, r'^(ping|heartbeat)$') &&
        .message != null && .message != ""
