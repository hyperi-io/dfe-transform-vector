# Fixture: 02_enrich_metadata
#
# Enrich events with pipeline metadata: pipeline name, processing timestamp,
# and the Kafka topic the event arrived on.
#
# The pipeline name is read with `get_env_var`: Vector expands no `${VAR}` in
# its config, so a placeholder would be written into every event as text.
#
# Inputs: auto-wired (follows previous transform in chain)

transforms:
  enrich_metadata:
    type: remap
    inputs:
      - parse_message
    source: |
      .pipeline = get_env_var("DFE_PIPELINE_NAME") ?? "unknown"
      .processed_at = now()
      .source_topic = to_string(.metadata.kafka.topic) ?? "unknown"
